{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h5>Cambiar contraseña</h5>
  <form method="post" class="card card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="actual">Contraseña actual</label>
    <input id="actual" name="actual" type="password" autocomplete="current-password" class="form-control mb-3" required>
    <label class="form-label" for="nueva">Nueva contraseña (mínimo 10 caracteres)</label>
    <input id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="10" maxlength="128" class="form-control mb-3" required>
    <label class="form-label" for="confirmacion">Confirmar contraseña</label>
    <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" class="form-control mb-3" required>
    <button class="btn btn-dark">Guardar contraseña</button>
  </form>
</div></div>
{% endblock %}
