{% extends "base.html" %}
{% block title %}Zapaterías{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center mb-3 gap-2">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h5 class="fw-bold mb-0"><i class="bi bi-building"></i> Zapaterías</h5>
    </div>

    <!-- Agregar nueva -->
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <form method="POST" action="{{ url_for('clientes.nueva_zapateria') }}" class="d-flex gap-2">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="text" name="nombre" class="form-control" placeholder="Nombre de la zapatería" required>
          <button type="submit" class="btn btn-dark text-nowrap">
            <i class="bi bi-plus"></i> Agregar
          </button>
        </form>
      </div>
    </div>

    <!-- Lista -->
    <div class="card border-0 shadow-sm">
      <div class="list-group list-group-flush">
        {% for z in zapaterias %}
        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
          <span class="fw-semibold {% if not z.activa %}text-muted text-decoration-line-through{% endif %}">
            {{ z.nombre }}
          </span>
          <form method="POST" action="{{ url_for('clientes.toggle_zapateria', id=z.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-sm {% if z.activa %}btn-outline-danger{% else %}btn-outline-success{% endif %}">
              {% if z.activa %}Desactivar{% else %}Activar{% endif %}
            </button>
          </form>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
